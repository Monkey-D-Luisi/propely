# SaaS Starter Kit - Production Build
#
# Builds all services from source and runs alongside infrastructure.
# Usage:
#   docker compose -f docker-compose.production.yml up --build
#   docker compose -f docker-compose.production.yml down
#
# Requires .env file with all secrets and configuration.

services:
  # ============================
  # Infrastructure
  # ============================

  postgres:
    image: postgres:16-alpine
    container_name: saastemplate-prod-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-saastemplate}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-saastemplate}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-saastemplate}"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: saastemplate-prod-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-saastemplate}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: saastemplate-prod-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $${REDIS_PASSWORD} ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================
  # Application Services
  # ============================

  ai-api:
    build:
      context: .
      dockerfile: services/ai-api/Dockerfile
    container_name: saastemplate-prod-ai-api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      AIAPI_ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=saastemplate_aiapi;Username=${POSTGRES_USER:-saastemplate};Password=${POSTGRES_PASSWORD}
      AIAPI_RabbitMQ__Host: rabbitmq
      AIAPI_RabbitMQ__Port: "5672"
      AIAPI_RabbitMQ__Username: ${RABBITMQ_USER:-saastemplate}
      AIAPI_RabbitMQ__Password: ${RABBITMQ_PASSWORD}
      AIAPI_Redis__ConnectionString: redis:6379,password=${REDIS_PASSWORD}
      AIAPI_OpenAi__ApiKey: ${AIAPI_OpenAi__ApiKey:-CHANGEME}
    ports:
      - "${AI_API_PORT:-5010}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health/live || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  orgs-api:
    build:
      context: .
      dockerfile: services/orgs-api/Dockerfile
    container_name: saastemplate-prod-orgs-api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ORGSAPI_ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=saastemplate_orgsapi;Username=${POSTGRES_USER:-saastemplate};Password=${POSTGRES_PASSWORD}
      ORGSAPI_RabbitMQ__Host: rabbitmq
      ORGSAPI_RabbitMQ__Port: "5672"
      ORGSAPI_RabbitMQ__Username: ${RABBITMQ_USER:-saastemplate}
      ORGSAPI_RabbitMQ__Password: ${RABBITMQ_PASSWORD}
      ORGSAPI_Redis__ConnectionString: redis:6379,password=${REDIS_PASSWORD}
      ORGSAPI_Jwt__Secret: ${ORGSAPI_Jwt__Secret}
      ORGSAPI_Smtp__Host: ${ORGSAPI_Smtp__Host:-mailhog}
      ORGSAPI_Smtp__Port: ${ORGSAPI_Smtp__Port:-1025}
    ports:
      - "${ORGS_API_PORT:-5020}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health/live || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # These MUST be set in .env or environment — no localhost fallback in production
        NEXT_PUBLIC_WEB_URL: ${NEXT_PUBLIC_WEB_URL:?NEXT_PUBLIC_WEB_URL is required}
        NEXT_PUBLIC_AI_API_URL: ${NEXT_PUBLIC_AI_API_URL:?NEXT_PUBLIC_AI_API_URL is required}
        NEXT_PUBLIC_ORGS_API_URL: ${NEXT_PUBLIC_ORGS_API_URL:?NEXT_PUBLIC_ORGS_API_URL is required}
    container_name: saastemplate-prod-web
    restart: unless-stopped
    environment:
      NODE_ENV: production
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      ai-api:
        condition: service_healthy
      orgs-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  postgres_data:
    name: saastemplate_prod_postgres_data
  rabbitmq_data:
    name: saastemplate_prod_rabbitmq_data
  redis_data:
    name: saastemplate_prod_redis_data
