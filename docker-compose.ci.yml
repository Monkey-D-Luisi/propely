# CI-specific Docker Compose overrides
# Purpose: Isolate CI containers and volumes from local development.
# Usage:   docker compose -f docker-compose.yml -f docker-compose.ci.yml --profile apps up -d --build
#
# This file overrides container_name and volume name directives so that
# CI resources (ci-propely-*) are fully independent of dev resources
# (propely-*). The E2E teardown (down --volumes) only destroys CI
# volumes, leaving dev data intact.
#
# NOTE: Host ports are NOT changed — the CI workflow stops any existing
# Docker stacks before starting, so port binding is not an issue.

services:
  postgres:
    container_name: ci-propely-postgres

  rabbitmq:
    container_name: ci-propely-rabbitmq

  redis:
    container_name: ci-propely-redis

  aspire-dashboard:
    container_name: ci-propely-aspire-dashboard

  mailhog:
    container_name: ci-propely-mailhog

  ai-api:
    container_name: ci-propely-ai-api

  orgs-api:
    container_name: ci-propely-orgs-api

  properties-api:
    container_name: ci-propely-properties-api

  publishing-api:
    container_name: ci-propely-publishing-api

  contacts-api:
    container_name: ci-propely-contacts-api

  appointments-api:
    container_name: ci-propely-appointments-api

  web:
    container_name: ci-propely-web

volumes:
  postgres_data:
    name: ci_propely_postgres_data
  rabbitmq_data:
    name: ci_propely_rabbitmq_data
  redis_data:
    name: ci_propely_redis_data
