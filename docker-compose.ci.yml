# CI-specific Docker Compose overrides
# Purpose: Isolate CI containers and volumes from local development.
# Usage:   docker compose -f docker-compose.yml -f docker-compose.ci.yml --profile apps up -d --build
#
# This file overrides container_name and volume name directives so that
# CI resources (ci-saastemplate-*) are fully independent of dev resources
# (saastemplate-*). The E2E teardown (down --volumes) only destroys CI
# volumes, leaving dev data intact.
#
# NOTE: Host ports are NOT changed — the CI workflow stops any existing
# Docker stacks before starting, so port binding is not an issue.

services:
  postgres:
    container_name: ci-saastemplate-postgres

  rabbitmq:
    container_name: ci-saastemplate-rabbitmq

  redis:
    container_name: ci-saastemplate-redis

  aspire-dashboard:
    container_name: ci-saastemplate-aspire-dashboard

  mailhog:
    container_name: ci-saastemplate-mailhog

  ai-api:
    container_name: ci-saastemplate-ai-api

  orgs-api:
    container_name: ci-saastemplate-orgs-api

  web:
    container_name: ci-saastemplate-web

volumes:
  postgres_data:
    name: ci_saastemplate_postgres_data
  rabbitmq_data:
    name: ci_saastemplate_rabbitmq_data
  redis_data:
    name: ci_saastemplate_redis_data
