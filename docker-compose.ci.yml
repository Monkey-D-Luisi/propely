# CI-specific Docker Compose overrides
# Purpose: Isolate CI containers/volumes from dev AND use production Dockerfiles
#          for fast startup (pre-compiled binaries instead of dotnet watch).
# Usage:   docker compose -f docker-compose.yml -f docker-compose.ci.yml --profile apps up -d --build
#
# Key differences from base docker-compose.yml:
#   - Production Dockerfiles (multi-stage, Alpine runtime) instead of Dockerfile.dev
#   - Build context is repo root (.) because production Dockerfiles reference cross-service projects
#   - No bind-mount volumes (production images contain all files)
#   - CI-namespaced containers (ci-propely-*) and volumes (ci_propely_*)
#   - Extended healthcheck budgets (CI runner is slower than dev machines)
#   - publishing-api uses host port 15040 (Windows CDPSvc conflict on self-hosted runner)

# Shared healthcheck for all .NET services in CI.
# Production images start fast but EF migrations on a cold Postgres can take
# 30-60s. Budget: 60s start_period + 20 retries × 10s = 260s total.
x-ci-healthcheck: &ci-healthcheck
  interval: 10s
  timeout: 5s
  retries: 20
  start_period: 60s

services:
  postgres:
    container_name: ci-propely-postgres

  rabbitmq:
    container_name: ci-propely-rabbitmq

  redis:
    container_name: ci-propely-redis

  aspire-dashboard:
    container_name: ci-propely-aspire-dashboard

  mailhog:
    container_name: ci-propely-mailhog

  ai-api:
    container_name: ci-propely-ai-api
    build:
      context: .
      dockerfile: services/ai-api/Dockerfile
    volumes: !override []
    healthcheck:
      <<: *ci-healthcheck
      test: ["CMD-SHELL", "wget -qO- http://localhost:5010/health/live || exit 1"]

  orgs-api:
    container_name: ci-propely-orgs-api
    build:
      context: .
      dockerfile: services/orgs-api/Dockerfile
    volumes: !override []
    healthcheck:
      <<: *ci-healthcheck
      test: ["CMD-SHELL", "wget -qO- http://localhost:5020/health/live || exit 1"]

  properties-api:
    container_name: ci-propely-properties-api
    build:
      context: .
      dockerfile: services/properties-api/Dockerfile
    volumes: !override []
    healthcheck:
      <<: *ci-healthcheck
      test: ["CMD-SHELL", "wget -qO- http://localhost:5030/health/live || exit 1"]

  publishing-api:
    container_name: ci-propely-publishing-api
    build:
      context: .
      dockerfile: services/publishing-api/Dockerfile
    volumes: !override []
    ports: !override
      - "127.0.0.1:15040:5040"
    healthcheck:
      <<: *ci-healthcheck
      test: ["CMD-SHELL", "wget -qO- http://localhost:5040/health/live || exit 1"]

  contacts-api:
    container_name: ci-propely-contacts-api
    build:
      context: .
      dockerfile: services/contacts-api/Dockerfile
    volumes: !override []
    healthcheck:
      <<: *ci-healthcheck
      test: ["CMD-SHELL", "wget -qO- http://localhost:5050/health/live || exit 1"]

  appointments-api:
    container_name: ci-propely-appointments-api
    build:
      context: .
      dockerfile: services/appointments-api/Dockerfile
    volumes: !override []
    healthcheck:
      <<: *ci-healthcheck
      test: ["CMD-SHELL", "wget -qO- http://localhost:5060/health/live || exit 1"]

  web:
    container_name: ci-propely-web
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    volumes: !override []

volumes:
  postgres_data:
    name: ci_propely_postgres_data
  rabbitmq_data:
    name: ci_propely_rabbitmq_data
  redis_data:
    name: ci_propely_redis_data
