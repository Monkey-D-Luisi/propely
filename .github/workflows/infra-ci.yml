name: Infrastructure CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'infra/terraform/**'
      - '.github/workflows/**'
      - '.github/actions/**'

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  terraform-validate:
    name: Terraform Validate
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        config:
          - { name: bootstrap, dir: infra/terraform/bootstrap }
          - { name: staging, dir: infra/terraform/environments/staging }
          - { name: production, dir: infra/terraform/environments/production }
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '~> 1.11'

      - name: Terraform Init
        working-directory: ${{ matrix.config.dir }}
        run: terraform init -backend=false

      - name: Terraform Validate
        working-directory: ${{ matrix.config.dir }}
        run: terraform validate

  actionlint:
    name: Lint GitHub Actions workflows
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install actionlint
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(gh api repos/rhysd/actionlint/releases/latest --jq '.tag_name' | sed 's/^v//')
          if [ "$RUNNER_OS" = "Windows" ]; then
            curl -sL "https://github.com/rhysd/actionlint/releases/download/v${VERSION}/actionlint_${VERSION}_windows_amd64.zip" -o "$RUNNER_TEMP/actionlint.zip"
            unzip -o "$RUNNER_TEMP/actionlint.zip" actionlint.exe -d "$RUNNER_TEMP"
          else
            curl -sL "https://github.com/rhysd/actionlint/releases/download/v${VERSION}/actionlint_${VERSION}_linux_amd64.tar.gz" | tar xz -C "$RUNNER_TEMP" actionlint
          fi
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Run actionlint
        run: actionlint
