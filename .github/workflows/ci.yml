name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.agent/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.agent/**'

env:
  DOTNET_VERSION: '10.0.x'
  NODE_VERSION: '22'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

permissions:
  contents: read
  actions: read
  pull-requests: read

defaults:
  run:
    shell: bash

jobs:
  changes:
    name: Detect Changes
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'services/**'
            web:
              - 'apps/web/**'

  dotnet-services:
    name: ${{ matrix.service.label }} - Build & Test
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        service:
          - { name: ai-api, solution: Propely.AiApi, label: AI API, coverage-threshold: '60' }
          - { name: orgs-api, solution: Propely.OrgsApi, label: Orgs API, coverage-threshold: '60' }
          - { name: properties-api, solution: Propely.PropertiesApi, label: Properties API, coverage-threshold: '30' }
          - { name: publishing-api, solution: Propely.PublishingApi, label: Publishing API, coverage-threshold: '30' }
          - { name: contacts-api, solution: Propely.ContactsApi, label: Contacts API, coverage-threshold: '30' }
          - { name: appointments-api, solution: Propely.AppointmentsApi, label: Appointments API, coverage-threshold: '30' }
    defaults:
      run:
        shell: bash
        working-directory: services/${{ matrix.service.name }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ matrix.service.name }}-${{ hashFiles(format('services/{0}/**/*.csproj', matrix.service.name)) }}
          restore-keys: |
            ${{ runner.os }}-nuget-${{ matrix.service.name }}-

      - name: Restore dependencies
        run: dotnet restore ${{ matrix.service.solution }}.sln

      - name: Check vulnerable NuGet packages
        run: |
          dotnet list ${{ matrix.service.solution }}.sln package --vulnerable --include-transitive 2>&1 | tee vuln-report.txt
          if grep -qi "Critical\|High" vuln-report.txt; then
            echo "::error::High or critical NuGet vulnerabilities found in ${{ matrix.service.name }}"
            exit 1
          fi

      - name: Build
        run: dotnet build ${{ matrix.service.solution }}.sln --no-restore --configuration Release

      - name: Test with coverage
        env:
          AIAPI_OpenAi__ApiKey: ${{ matrix.service.name == 'ai-api' && secrets.AIAPI_OPENAI_API_KEY || '' }}
        run: |
          dotnet test ${{ matrix.service.solution }}.sln --no-build --configuration Release \
            --collect:"XPlat Code Coverage" \
            --results-directory ./coverage \
            --logger "trx;LogFileName=test-results.trx"

      - name: Check coverage threshold
        uses: ./.github/actions/check-coverage
        with:
          coverage-path: services/${{ matrix.service.name }}/coverage/**/coverage.cobertura.xml
          threshold: ${{ matrix.service.coverage-threshold }}
          report-dir: services/${{ matrix.service.name }}/coverage/report

      - name: Upload test results
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: ${{ matrix.service.name }}-test-results
          path: services/${{ matrix.service.name }}/coverage/**/*.trx
          retention-days: 7

      - name: Upload coverage report
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: ${{ matrix.service.name }}-coverage
          path: services/${{ matrix.service.name }}/coverage/report/
          retention-days: 7

  web:
    name: Web - Build & Test
    needs: changes
    if: needs.changes.outputs.web == 'true' || github.event_name == 'push'
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    defaults:
      run:
        shell: bash
        working-directory: apps/web
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high --omit=dev

      - name: Lint
        run: npm run lint --if-present

      - name: Test with coverage
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - name: Upload coverage report
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: web-coverage
          path: apps/web/coverage/
          retention-days: 7

  e2e:
    name: E2E Smoke Tests
    needs: [changes, dotnet-services, web, license-headers, third-party-notices]
    if: >-
      always() &&
      !cancelled() &&
      !contains(needs.*.result, 'failure') &&
      (
        needs.changes.outputs.backend == 'true' ||
        needs.changes.outputs.web == 'true' ||
        github.event_name == 'push'
      )
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        working-directory: apps/web
        run: npm ci

      - name: Install Playwright browsers
        working-directory: apps/web
        run: npx playwright install --with-deps chromium

      - name: Create .env from example
        run: cp .env.example .env

      - name: Free ports used by E2E stack
        run: |
          # Stop any Docker Compose stacks (dev or CI) that might hold ports
          docker compose --profile apps down 2>/dev/null || true
          docker compose -f docker-compose.yml -f docker-compose.ci.yml --profile apps down --volumes 2>/dev/null || true
          # Kill any bare process (dotnet, node, etc.) still bound to E2E ports
          for port in 3000 5010 5020 5030 5040 5050 5060 5432 5672 6379; do
            if [ "$RUNNER_OS" = "Windows" ]; then
              pid=$(powershell -Command "(Get-NetTCPConnection -LocalPort $port -State Listen -ErrorAction SilentlyContinue | Select-Object -First 1).OwningProcess" 2>/dev/null | tr -d '\r')
              if [ -n "$pid" ] && [ "$pid" != "0" ]; then
                echo "Killing PID $pid on port $port"
                taskkill //F //PID "$pid" 2>/dev/null || true
              fi
            else
              pid=$(lsof -ti :"$port" 2>/dev/null || true)
              if [ -n "$pid" ]; then
                echo "Killing PID $pid on port $port"
                kill -9 "$pid" 2>/dev/null || true
              fi
            fi
          done

      - name: Build Docker images (sequential to avoid BuildKit OOM)
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml --profile apps build
        env:
          COMPOSE_PARALLEL_LIMIT: 1

      - name: Start full stack
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml --profile apps up -d

      - name: Wait for services to be healthy
        run: |
          echo "Waiting for services to be ready..."
          for i in $(seq 1 60); do
            ai_ok=$(curl -sf http://localhost:5010/health/ready || echo "fail")
            orgs_ok=$(curl -sf http://localhost:5020/health/ready || echo "fail")
            props_ok=$(curl -sf http://localhost:5030/health/ready || echo "fail")
            pub_ok=$(curl -sf http://localhost:5040/health/ready || echo "fail")
            contacts_ok=$(curl -sf http://localhost:5050/health/ready || echo "fail")
            appts_ok=$(curl -sf http://localhost:5060/health/ready || echo "fail")
            web_ok=$(curl -sf http://localhost:3000/en || echo "fail")
            if [ "$ai_ok" != "fail" ] && [ "$orgs_ok" != "fail" ] && \
               [ "$props_ok" != "fail" ] && [ "$pub_ok" != "fail" ] && \
               [ "$contacts_ok" != "fail" ] && [ "$appts_ok" != "fail" ] && \
               [ "$web_ok" != "fail" ]; then
              echo "All services are ready."
              exit 0
            fi
            echo "Attempt $i/60: waiting 5s..."
            sleep 5
          done
          echo "::error::Services did not become ready within 5 minutes"
          docker compose -f docker-compose.yml -f docker-compose.ci.yml --profile apps logs
          exit 1
        timeout-minutes: 6

      - name: Run E2E tests
        working-directory: apps/web
        run: npx playwright test

      - name: Upload Playwright report
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

      - name: Upload test results
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: e2e-results
          path: apps/web/e2e-results/
          retention-days: 7

      - name: Stop services
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml --profile apps down --volumes

  third-party-notices:
    name: Third-Party Notices - Staleness Check
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Compute current dependency hash
        id: hash
        run: |
          CURRENT_HASH=$( (find services/ai-api/src services/orgs-api/src services/properties-api/src services/publishing-api/src services/contacts-api/src services/appointments-api/src -name '*.csproj' -print; echo "apps/web/package-lock.json") | sort | xargs sha256sum | awk '{print $1}' | sort | sha256sum | cut -d' ' -f1)
          STORED_HASH=$(cat .third-party-notices-hash 2>/dev/null || echo "none")
          echo "current=$CURRENT_HASH" >> "$GITHUB_OUTPUT"
          echo "stored=$STORED_HASH" >> "$GITHUB_OUTPUT"

      - name: Check staleness
        run: |
          if [ "${{ steps.hash.outputs.current }}" != "${{ steps.hash.outputs.stored }}" ]; then
            echo "::warning::THIRD_PARTY_NOTICES.md may be stale. Dependencies have changed since last generation. Run: ./scripts/generate-third-party-notices.sh"
          else
            echo "Third-party notices are up to date."
          fi

  license-headers:
    name: License Headers Check
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Verify license headers
        run: bash scripts/verify-license-headers.sh
