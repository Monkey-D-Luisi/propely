version: 2
updates:
  # NuGet - AI API
  - package-ecosystem: nuget
    directory: /services/ai-api
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - dotnet
    groups:
      all-nuget:
        patterns:
          - "*"

  # NuGet - Orgs API
  - package-ecosystem: nuget
    directory: /services/orgs-api
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - dotnet
    groups:
      all-nuget:
        patterns:
          - "*"

  # NuGet - Properties API
  - package-ecosystem: nuget
    directory: /services/properties-api
    schedule:
