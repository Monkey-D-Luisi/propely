# Propely - Local Development
# Infrastructure only:  docker compose up -d
# Full stack (+ apps):  docker compose --profile apps up -d
# Stop:                 .\scripts\dev-down.ps1
# Reset:                .\scripts\dev-reset.ps1

services:
  postgres:
    image: postgres:16-alpine
    container_name: propely-postgres
    restart: unless-stopped
    mem_limit: 512m
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-propely}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-propely_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-propely}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-propely}"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: propely-rabbitmq
    restart: unless-stopped
    mem_limit: 512m
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-propely}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-propely_dev_password}
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: propely-redis
    restart: unless-stopped
    mem_limit: 256m
    command: redis-server --requirepass ${REDIS_PASSWORD:-propely_dev_password} --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $${REDIS_PASSWORD:-propely_dev_password} ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  aspire-dashboard:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:9.0
    container_name: propely-aspire-dashboard
    restart: unless-stopped
    mem_limit: 256m
    environment:
      - DOTNET_DASHBOARD_UNSECURED_ALLOW_ANONYMOUS=true
    ports:
      - "127.0.0.1:18888:18888"   # Dashboard UI
      - "127.0.0.1:4317:18889"    # OTLP gRPC (external 4317 -> internal 18889)
      - "127.0.0.1:4318:18890"    # OTLP HTTP (external 4318 -> internal 18890)

  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: propely-mailhog
    restart: unless-stopped
    mem_limit: 256m
    ports:
      - "127.0.0.1:10025:1025"
      - "127.0.0.1:18025:8025"

  # ============================
  # Application Services (profile: apps)
  # Activated with: docker compose --profile apps up -d
  # ============================

  ai-api:
    build:
      context: ./services/ai-api
      dockerfile: Dockerfile.dev
    container_name: propely-ai-api
    restart: unless-stopped
    profiles: ["apps"]
    mem_limit: 1g
    env_file:
      - .env
      - .env.docker
    volumes:
      - ./services/ai-api:/src
      - ai-api-obj-domain:/src/src/Propely.AiApi.Domain/obj
      - ai-api-obj-app:/src/src/Propely.AiApi.Application/obj
      - ai-api-obj-infra:/src/src/Propely.AiApi.Infrastructure/obj
      - ai-api-obj-api:/src/src/Propely.AiApi.Api/obj
    ports:
      - "127.0.0.1:5010:5010"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:5010/health/live || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 180s

  orgs-api:
    build:
      context: ./services/orgs-api
      dockerfile: Dockerfile.dev
    container_name: propely-orgs-api
    restart: unless-stopped
    profiles: ["apps"]
    mem_limit: 1g
    env_file:
      - .env
      - .env.docker
    volumes:
      - ./services/orgs-api:/src
      - orgs-api-obj-domain:/src/src/Propely.OrgsApi.Domain/obj
      - orgs-api-obj-app:/src/src/Propely.OrgsApi.Application/obj
      - orgs-api-obj-infra:/src/src/Propely.OrgsApi.Infrastructure/obj
      - orgs-api-obj-api:/src/src/Propely.OrgsApi.Api/obj
    ports:
      - "127.0.0.1:5020:5020"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:5020/health/live || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  properties-api:
    build:
      context: ./services/properties-api
      dockerfile: Dockerfile.dev
    container_name: propely-properties-api
    restart: unless-stopped
    profiles: ["apps"]
    mem_limit: 1g
    env_file:
      - .env
      - .env.docker
    volumes:
      - ./services/properties-api:/src
      - properties-api-obj-domain:/src/src/Propely.PropertiesApi.Domain/obj
      - properties-api-obj-app:/src/src/Propely.PropertiesApi.Application/obj
      - properties-api-obj-infra:/src/src/Propely.PropertiesApi.Infrastructure/obj
      - properties-api-obj-api:/src/src/Propely.PropertiesApi.Api/obj
    ports:
      - "127.0.0.1:5030:5030"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:5030/health/live || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  publishing-api:
    build:
      context: ./services/publishing-api
      dockerfile: Dockerfile.dev
    container_name: propely-publishing-api
    restart: unless-stopped
    profiles: ["apps"]
    mem_limit: 1g
    env_file:
      - .env
      - .env.docker
    volumes:
      - ./services/publishing-api:/src
      - publishing-api-obj-domain:/src/src/Propely.PublishingApi.Domain/obj
      - publishing-api-obj-app:/src/src/Propely.PublishingApi.Application/obj
      - publishing-api-obj-infra:/src/src/Propely.PublishingApi.Infrastructure/obj
      - publishing-api-obj-api:/src/src/Propely.PublishingApi.Api/obj
    ports:
      - "127.0.0.1:5040:5040"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:5040/health/live || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  contacts-api:
    build:
      context: ./services/contacts-api
      dockerfile: Dockerfile.dev
    container_name: propely-contacts-api
    restart: unless-stopped
    profiles: ["apps"]
    mem_limit: 1g
    env_file:
      - .env
      - .env.docker
    volumes:
      - ./services/contacts-api:/src
      - contacts-api-obj-domain:/src/src/Propely.ContactsApi.Domain/obj
      - contacts-api-obj-app:/src/src/Propely.ContactsApi.Application/obj
      - contacts-api-obj-infra:/src/src/Propely.ContactsApi.Infrastructure/obj
      - contacts-api-obj-api:/src/src/Propely.ContactsApi.Api/obj
    ports:
      - "127.0.0.1:5050:5050"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:5050/health/live || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  appointments-api:
    build:
      context: ./services/appointments-api
      dockerfile: Dockerfile.dev
    container_name: propely-appointments-api
    restart: unless-stopped
    profiles: ["apps"]
    mem_limit: 1g
    env_file:
      - .env
      - .env.docker
    volumes:
      - ./services/appointments-api:/src
      - appointments-api-obj-domain:/src/src/Propely.AppointmentsApi.Domain/obj
      - appointments-api-obj-app:/src/src/Propely.AppointmentsApi.Application/obj
      - appointments-api-obj-infra:/src/src/Propely.AppointmentsApi.Infrastructure/obj
      - appointments-api-obj-api:/src/src/Propely.AppointmentsApi.Api/obj
    ports:
      - "127.0.0.1:5060:5060"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:5060/health/live || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile.dev
    container_name: propely-web
    restart: unless-stopped
    profiles: ["apps"]
    mem_limit: 1g
    env_file:
      - .env
      - .env.docker
    environment:
      - WATCHPACK_POLLING=true
    volumes:
      - ./apps/web:/app
      - web-node-modules:/app/node_modules
      - web-next:/app/.next
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      ai-api:
        condition: service_healthy
      orgs-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  postgres_data:
    name: propely_postgres_data
  rabbitmq_data:
    name: propely_rabbitmq_data
  redis_data:
    name: propely_redis_data
  ai-api-obj-domain:
  ai-api-obj-app:
  ai-api-obj-infra:
  ai-api-obj-api:
  orgs-api-obj-domain:
  orgs-api-obj-app:
  orgs-api-obj-infra:
  orgs-api-obj-api:
  properties-api-obj-domain:
  properties-api-obj-app:
  properties-api-obj-infra:
  properties-api-obj-api:
  publishing-api-obj-domain:
  publishing-api-obj-app:
  publishing-api-obj-infra:
  publishing-api-obj-api:
  contacts-api-obj-domain:
  contacts-api-obj-app:
  contacts-api-obj-infra:
  contacts-api-obj-api:
  appointments-api-obj-domain:
  appointments-api-obj-app:
  appointments-api-obj-infra:
  appointments-api-obj-api:
  web-node-modules:
  web-next:
