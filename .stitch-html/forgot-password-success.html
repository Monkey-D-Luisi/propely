<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Forgot Password Success - SaaS</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#5048e5",
                        "primary-hover": "#4338ca",
                        "background-light": "#f6f6f8",
                        "background-dark": "#121121",
                        "card-light": "#ffffff",
                        "card-dark": "#1e1c30",
                        "border-light": "#e2e8f0",
                        "border-dark": "#2d2b42",
                        "success-bg": "#dcfce7",
                        "success-text": "#16a34a",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: {"DEFAULT": "0.5rem", "lg": "1rem", "xl": "1.5rem", "full": "9999px"},
                    boxShadow: {
                        "soft": "0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03)",
                        "glow": "0 0 15px rgba(80, 72, 229, 0.15)"
                    }
                },
            },
        }
    </script>
<style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .bg-grid-pattern {
            background-image: linear-gradient(to right, rgba(0,0,0,0.04) 1px, transparent 1px),
                              linear-gradient(to bottom, rgba(0,0,0,0.04) 1px, transparent 1px);
            background-size: 40px 40px;
        }
        .dark .bg-grid-pattern {
            background-image: linear-gradient(to right, rgba(255,255,255,0.02) 1px, transparent 1px),
                              linear-gradient(to bottom, rgba(255,255,255,0.02) 1px, transparent 1px);
        }
    </style>
</head>
<body class="bg-background-light dark:bg-background-dark font-display antialiased min-h-screen flex items-center justify-center relative overflow-hidden transition-colors duration-200">
<!-- Background Decoration -->
<div class="absolute inset-0 bg-grid-pattern pointer-events-none z-0"></div>
<div class="absolute top-0 left-0 w-full h-full overflow-hidden pointer-events-none z-0">
<div class="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] bg-primary/5 rounded-full blur-[120px]"></div>
<div class="absolute bottom-[-10%] right-[-10%] w-[40%] h-[40%] bg-blue-500/5 rounded-full blur-[120px]"></div>
</div>
<!-- Main Card Container -->
<main class="w-full max-w-md px-4 relative z-10">
<!-- Brand Logo (Optional placement for context) -->
<div class="flex justify-center mb-8">
<div class="flex items-center gap-2">
<div class="w-8 h-8 bg-primary rounded-lg flex items-center justify-center shadow-glow">
<span class="material-icons text-white text-lg">layers</span>
</div>
<span class="text-xl font-bold text-slate-900 dark:text-white tracking-tight">Nexus</span>
</div>
</div>
<!-- Success Card -->
<div class="bg-card-light dark:bg-card-dark rounded-xl shadow-soft border border-border-light dark:border-border-dark p-8 sm:p-10 text-center transition-all duration-300">
<!-- Success Icon -->
<div class="mx-auto w-16 h-16 bg-success-bg dark:bg-green-900/30 rounded-full flex items-center justify-center mb-6 animate-[bounce_1s_ease-out_1]">
<span class="material-icons text-success-text dark:text-green-400 text-3xl">check_circle</span>
</div>
<!-- Content -->
<h1 class="text-2xl font-bold text-slate-900 dark:text-white mb-3 tracking-tight">Check your email</h1>
<p class="text-slate-600 dark:text-slate-400 mb-8 leading-relaxed">
                We sent a password reset link to <br/>
<span class="font-medium text-slate-900 dark:text-slate-200">name@company.com</span>
</p>
<!-- Primary Action -->
<button class="w-full bg-primary hover:bg-primary-hover text-white font-medium py-2.5 px-4 rounded-lg shadow-sm shadow-primary/30 transition-all duration-200 flex items-center justify-center gap-2 group mb-6 focus:ring-4 focus:ring-primary/20 outline-none" type="button">
<span>Open email app</span>
<span class="material-icons text-sm group-hover:translate-x-0.5 transition-transform">open_in_new</span>
</button>
<!-- Resend Link -->
<p class="text-sm text-slate-500 dark:text-slate-500">
                Didn't receive the email? 
                <a class="text-primary hover:text-primary-hover font-medium transition-colors ml-1 focus:outline-none focus:underline" href="#">Click to resend</a>
</p>
</div>
<!-- Back to Login -->
<div class="mt-8 text-center">
<a class="inline-flex items-center gap-2 text-sm font-medium text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white transition-colors group" href="#">
<span class="material-icons text-lg group-hover:-translate-x-1 transition-transform text-slate-400 dark:text-slate-500 group-hover:text-slate-600 dark:group-hover:text-slate-300">arrow_back</span>
                Back to sign in
            </a>
</div>
<!-- Footer Help -->
<div class="mt-12 text-center">
<p class="text-xs text-slate-400 dark:text-slate-600">
                © 2023 Nexus Inc. Need help? <a class="hover:text-primary transition-colors" href="#">Contact Support</a>
</p>
</div>
</main>
<!-- Theme Toggle (Hidden utility for demonstration, assuming system preference or parent control) -->
<script>
        // Simple theme check to ensure dark mode works if system pref is dark
        if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
            document.documentElement.classList.add('dark');
        }
    </script>
</body></html>
