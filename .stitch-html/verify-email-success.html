<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Propely Email Verification Success Screen</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#5048e5",
                        "background-light": "#f6f6f8",
                        "background-dark": "#121121",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: {"DEFAULT": "0.5rem", "lg": "1rem", "xl": "1.5rem", "full": "9999px"},
                },
            },
        }
    </script>
</head>
<body class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-slate-100 min-h-screen flex flex-col relative overflow-x-hidden">
<div class="absolute top-0 left-0 w-full h-[400px] bg-gradient-to-b from-primary/10 to-transparent pointer-events-none -z-10"></div>
<div class="flex-1 flex flex-col justify-center items-center p-6 sm:p-12 relative z-10">
<div class="flex items-center gap-3 mb-8">
<div class="w-8 h-8 text-primary">
<svg fill="currentColor" viewbox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
<path clip-rule="evenodd" d="M47.2426 24L24 47.2426L0.757355 24L24 0.757355L47.2426 24ZM12.2426 21H35.7574L24 9.24264L12.2426 21Z" fill-rule="evenodd"></path>
</svg>
</div>
<h1 class="text-2xl font-bold tracking-tight text-slate-900 dark:text-white">Propely</h1>
</div>
<div class="w-full max-w-md bg-white dark:bg-slate-800 rounded-xl shadow-sm border border-slate-200 dark:border-slate-700 p-8 flex flex-col items-center text-center relative overflow-hidden">
<div class="absolute top-0 left-0 w-full h-full pointer-events-none opacity-50 dark:opacity-20" style="background-image: radial-gradient(circle at center, rgba(80, 72, 229, 0.05) 0%, transparent 70%);"></div>
<div class="w-16 h-16 bg-green-50 dark:bg-green-900/30 rounded-full flex items-center justify-center mb-6 relative z-10">
<span class="material-symbols-outlined text-4xl text-green-500 dark:text-green-400">check_circle</span>
</div>
<h2 class="text-2xl font-bold text-slate-900 dark:text-white mb-2 relative z-10">Email verified!</h2>
<p class="text-slate-500 dark:text-slate-400 mb-8 relative z-10">
                Your email has been successfully verified. Welcome to Propely! You can now access all features.
            </p>
<button class="w-full h-12 bg-primary hover:bg-primary/90 text-white rounded-lg font-semibold flex items-center justify-center gap-2 transition-colors relative z-10">
                Go to Dashboard
                <span class="material-symbols-outlined text-xl">arrow_right_alt</span>
</button>
<p class="mt-6 text-xs italic text-slate-400 dark:text-slate-500 relative z-10">
                You'll be redirected automatically in <span class="font-semibold">5</span> seconds...
            </p>
</div>
<footer class="mt-12 text-center text-sm text-slate-500 dark:text-slate-400">
            © 2023 Propely. All rights reserved.
        </footer>
</div>
</body></html>
