<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Propely - New Agency</title>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#2513ec",
                        "background-light": "#f6f6f8",
                        "background-dark": "#121022",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: {"DEFAULT": "0.5rem", "lg": "1rem", "xl": "1.5rem", "full": "9999px"},
                },
            },
        }
    </script>
</head>
<body class="bg-background-light dark:bg-background-dark font-display min-h-screen text-slate-900 dark:text-slate-100 flex flex-col">
<div class="relative flex h-auto min-h-screen w-full flex-col group/design-root overflow-x-hidden">
<div class="layout-container flex h-full grow flex-col">
<!-- Top Navigation -->
<header class="flex items-center justify-between whitespace-nowrap border-b border-solid border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 px-10 py-3 sticky top-0 z-10">
<div class="flex items-center gap-8">
<div class="flex items-center gap-4 text-slate-900 dark:text-white">
<div class="size-6 text-primary">
<svg class="w-full h-full" fill="none" viewbox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
<path clip-rule="evenodd" d="M47.2426 24L24 47.2426L0.757355 24L24 0.757355L47.2426 24ZM12.2426 21H35.7574L24 9.24264L12.2426 21Z" fill="currentColor" fill-rule="evenodd"></path>
</svg>
</div>
<h2 class="text-lg font-bold leading-tight tracking-[-0.015em]">Propely</h2>
</div>
<label class="flex flex-col min-w-40 !h-10 max-w-64">
<div class="flex w-full flex-1 items-stretch rounded-xl h-full bg-slate-100 dark:bg-slate-800">
<div class="text-slate-500 dark:text-slate-400 flex items-center justify-center pl-4 rounded-l-xl border-r-0">
<span class="material-symbols-outlined text-[20px]">search</span>
</div>
<input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-xl text-slate-900 dark:text-white focus:outline-0 focus:ring-0 border-none bg-transparent focus:border-none h-full placeholder:text-slate-500 dark:placeholder:text-slate-400 px-4 rounded-l-none border-l-0 pl-2 text-sm font-medium leading-normal" placeholder="Search..." value=""/>
</div>
</label>
</div>
<div class="flex flex-1 justify-end gap-8">
<nav class="flex items-center gap-9">
<a class="text-slate-600 dark:text-slate-300 hover:text-primary dark:hover:text-primary transition-colors text-sm font-medium leading-normal" href="#">Dashboard</a>
<a class="text-primary dark:text-primary text-sm font-medium leading-normal" href="#">Agencies</a>
<a class="text-slate-600 dark:text-slate-300 hover:text-primary dark:hover:text-primary transition-colors text-sm font-medium leading-normal" href="#">Properties</a>
<a class="text-slate-600 dark:text-slate-300 hover:text-primary dark:hover:text-primary transition-colors text-sm font-medium leading-normal" href="#">Settings</a>
</nav>
<button class="flex min-w-[84px] cursor-pointer items-center justify-center overflow-hidden rounded-xl h-10 px-5 bg-primary hover:bg-primary/90 transition-colors text-white text-sm font-bold leading-normal tracking-[0.015em]">
<span class="truncate">New Agency</span>
</button>
<div class="bg-center bg-no-repeat aspect-square bg-cover rounded-full size-10 border border-slate-200 dark:border-slate-700" data-alt="User Avatar" style='background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuA8QCpMmSKoxbHEjdhmw7gORTZ6wwsdwlNXORT2fuYt1VjzkD1guBIaoOtnBryJrFMm5479wh0b9l_4NbFzcOuY2rOioKxhmg6z8fUjQf4oj7_SNapbZAb1MBR9bkaSJlv4IQNHAoQ69CQb8jNt2pR9BGmYrBp8A7lQ6ZC272axU6CmMtxDPPLJj7cF_F8hhE_FHSxINzFUsJJ-kobzVbf81tMpVcf-5CxWlcPzneFSa0fgSpSD6mkb4COlYGgPvqGPMk2i__tyuOJI");'></div>
</div>
</header>
<!-- Main Content -->
<main class="flex flex-1 justify-center py-8 px-4 sm:px-8">
<div class="flex flex-col max-w-[800px] w-full gap-6">
<!-- Header & Breadcrumbs -->
<div class="flex flex-col gap-4">
<nav class="flex flex-wrap items-center gap-2 text-sm">
<a class="text-slate-500 dark:text-slate-400 hover:text-primary transition-colors font-medium" href="#">Agencies</a>
<span class="material-symbols-outlined text-slate-400 text-[18px]">chevron_right</span>
<a class="text-slate-500 dark:text-slate-400 hover:text-primary transition-colors font-medium" href="#">Inmobiliaria Madrid</a>
<span class="material-symbols-outlined text-slate-400 text-[18px]">chevron_right</span>
<span class="text-slate-900 dark:text-white font-medium">New Agency</span>
</nav>
<div>
<h1 class="text-3xl font-bold leading-tight tracking-[-0.033em] text-slate-900 dark:text-white">Create New Agency</h1>
<p class="text-slate-500 dark:text-slate-400 mt-1">Add a new branch office to Inmobiliaria Madrid.</p>
</div>
</div>
<!-- Form Card -->
<div class="bg-white dark:bg-slate-900 rounded-xl shadow-sm border border-slate-200 dark:border-slate-800 p-6 sm:p-8">
<form class="flex flex-col gap-10">
<!-- Basic Information -->
<section class="flex flex-col gap-6">
<h2 class="text-lg font-bold text-slate-900 dark:text-white border-b border-slate-100 dark:border-slate-800 pb-3">Basic Information</h2>
<div class="grid grid-cols-1 md:grid-cols-2 gap-6">
<label class="flex flex-col gap-2">
<span class="text-sm font-semibold text-slate-700 dark:text-slate-300">Agency Name *</span>
<input class="form-input w-full rounded-lg border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-white focus:border-primary focus:ring-primary h-11 placeholder:text-slate-400" placeholder="e.g., Madrid Centro Office" required="" type="text"/>
</label>
<label class="flex flex-col gap-2">
<span class="text-sm font-semibold text-slate-700 dark:text-slate-300">Slug</span>
<div class="flex rounded-lg shadow-sm">
<span class="inline-flex items-center px-3 rounded-l-lg border border-r-0 border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-800/50 text-slate-500 dark:text-slate-400 text-sm">
                                            propely.com/
                                        </span>
<input class="form-input flex-1 min-w-0 block w-full rounded-none rounded-r-lg border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-white focus:border-primary focus:ring-primary h-11 placeholder:text-slate-400" placeholder="madrid-centro" type="text"/>
</div>
</label>
</div>
<label class="flex flex-col gap-2">
<span class="text-sm font-semibold text-slate-700 dark:text-slate-300">Description</span>
<textarea class="form-textarea w-full rounded-lg border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-white focus:border-primary focus:ring-primary min-h-[100px] placeholder:text-slate-400 resize-y" placeholder="Brief description of this branch..."></textarea>
</label>
</section>
<!-- Location & Contact -->
<section class="flex flex-col gap-6">
<h2 class="text-lg font-bold text-slate-900 dark:text-white border-b border-slate-100 dark:border-slate-800 pb-3">Location &amp; Contact</h2>
<label class="flex flex-col gap-2">
<span class="text-sm font-semibold text-slate-700 dark:text-slate-300">Address Line 1</span>
<input class="form-input w-full rounded-lg border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-white focus:border-primary focus:ring-primary h-11" placeholder="Street address, P.O. box, etc." type="text"/>
</label>
<div class="grid grid-cols-1 md:grid-cols-2 gap-6">
<label class="flex flex-col gap-2">
<span class="text-sm font-semibold text-slate-700 dark:text-slate-300">City</span>
<input class="form-input w-full rounded-lg border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-white focus:border-primary focus:ring-primary h-11" placeholder="City" type="text"/>
</label>
<label class="flex flex-col gap-2">
<span class="text-sm font-semibold text-slate-700 dark:text-slate-300">State / Province</span>
<input class="form-input w-full rounded-lg border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-white focus:border-primary focus:ring-primary h-11" placeholder="State" type="text"/>
</label>
<label class="flex flex-col gap-2">
<span class="text-sm font-semibold text-slate-700 dark:text-slate-300">Postal Code</span>
<input class="form-input w-full rounded-lg border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-white focus:border-primary focus:ring-primary h-11" placeholder="e.g. 28001" type="text"/>
</label>
<label class="flex flex-col gap-2">
<span class="text-sm font-semibold text-slate-700 dark:text-slate-300">Country</span>
<select class="form-select w-full rounded-lg border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-white focus:border-primary focus:ring-primary h-11">
<option selected="" value="ES">Spain</option>
<option value="PT">Portugal</option>
<option value="FR">France</option>
<option value="UK">United Kingdom</option>
</select>
</label>
</div>
<div class="grid grid-cols-1 md:grid-cols-2 gap-6 mt-2">
<label class="flex flex-col gap-2">
<span class="text-sm font-semibold text-slate-700 dark:text-slate-300">Phone Number</span>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-slate-400 text-[20px]">phone</span>
</div>
<input class="form-input w-full pl-10 rounded-lg border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-white focus:border-primary focus:ring-primary h-11" placeholder="+34 600 000 000" type="tel"/>
</div>
</label>
<label class="flex flex-col gap-2">
<span class="text-sm font-semibold text-slate-700 dark:text-slate-300">Email Address</span>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-slate-400 text-[20px]">mail</span>
</div>
<input class="form-input w-full pl-10 rounded-lg border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-white focus:border-primary focus:ring-primary h-11" placeholder="agency@example.com" type="email"/>
</div>
</label>
</div>
</section>
<!-- Actions -->
<div class="flex items-center justify-end gap-4 pt-6 border-t border-slate-200 dark:border-slate-800">
<button class="px-5 py-2.5 text-sm font-semibold text-slate-600 dark:text-slate-300 hover:text-slate-900 dark:hover:text-white transition-colors" type="button">
                                Cancel
                            </button>
<button class="px-6 py-2.5 rounded-xl bg-primary hover:bg-primary/90 text-white text-sm font-bold shadow-sm transition-colors" type="submit">
                                Create Agency
                            </button>
</div>
</form>
</div>
</div>
</main>
</div>
</div>
</body></html>
