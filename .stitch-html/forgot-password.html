<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Propely - Forgot Password</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#5048e5",
                        "background-light": "#f6f6f8",
                        "background-dark": "#121121",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: {"DEFAULT": "0.5rem", "lg": "1rem", "xl": "1.5rem", "full": "9999px"},
                },
            },
        }
    </script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
</head>
<body class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-slate-100 min-h-screen flex flex-col relative overflow-x-hidden">
<!-- Subtle gradient mesh background -->
<div class="absolute inset-0 z-0 pointer-events-none overflow-hidden h-[400px]">
<div class="absolute -top-[200px] -left-[100px] w-[600px] h-[600px] rounded-full bg-primary/5 blur-[100px]"></div>
<div class="absolute -top-[100px] -right-[100px] w-[500px] h-[500px] rounded-full bg-primary/10 blur-[80px]"></div>
</div>
<div class="relative z-10 flex-1 flex flex-col items-center justify-center p-6">
<!-- Logo Header -->
<div class="flex items-center gap-2 mb-8">
<div class="w-8 h-8 rounded bg-primary flex items-center justify-center rotate-45">
<div class="w-4 h-4 bg-white -rotate-45"></div>
</div>
<span class="text-2xl font-bold tracking-tight text-slate-900 dark:text-white">Propely</span>
</div>
<!-- Main Card -->
<div class="w-full max-w-[448px] bg-white dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-800 shadow-sm flex flex-col p-8">
<!-- Icon -->
<div class="w-16 h-16 bg-primary/10 rounded-full flex items-center justify-center mx-auto mb-6">
<span class="material-symbols-outlined text-3xl text-primary">key</span>
</div>
<!-- Title & Description -->
<h1 class="text-2xl font-bold text-center text-slate-900 dark:text-white mb-2">Forgot your password?</h1>
<p class="text-slate-500 dark:text-slate-400 text-center text-sm mb-8">
                Enter your email address and we'll send you a link to reset your password.
            </p>
<!-- Form -->
<form class="flex flex-col gap-4">
<div class="flex flex-col gap-2">
<label class="text-sm font-medium text-slate-700 dark:text-slate-300" for="email">Email address</label>
<input class="w-full px-4 py-3 rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-white focus:ring-2 focus:ring-primary focus:border-primary focus:outline-none transition-colors placeholder:text-slate-400" id="email" placeholder="name@company.com" required="" type="email"/>
</div>
<button class="w-full bg-primary hover:bg-primary/90 text-white font-medium py-3 px-4 rounded-lg transition-colors mt-2" type="submit">
                    Send Reset Link
                </button>
</form>
<!-- Divider -->
<div class="flex items-center gap-4 my-8">
<div class="h-px bg-slate-200 dark:bg-slate-800 flex-1"></div>
</div>
<!-- Back to Login -->
<a class="flex items-center justify-center gap-2 text-sm font-medium text-slate-600 dark:text-slate-400 hover:text-primary dark:hover:text-primary transition-colors" href="#">
<span class="material-symbols-outlined text-[18px]">arrow_back</span>
                Back to sign in
            </a>
</div>
</div>
<!-- Footer Disclaimer -->
<div class="relative z-10 py-6 text-center text-xs text-slate-400 dark:text-slate-500 max-w-[448px] mx-auto w-full px-6">
        This site is protected by reCAPTCHA and the Google 
        <a class="text-slate-500 dark:text-slate-400 hover:text-primary underline" href="#">Privacy Policy</a> and 
        <a class="text-slate-500 dark:text-slate-400 hover:text-primary underline" href="#">Terms of Service</a> apply.
    </div>
</body></html>
