<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Forgot Password - SaaS Recovery</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#5048e5",
                        "background-light": "#f6f6f8",
                        "background-dark": "#121121",
                        "surface-light": "#ffffff",
                        "surface-dark": "#1e1e2e",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: {"DEFAULT": "0.5rem", "lg": "0.75rem", "xl": "1rem", "full": "9999px"},
                },
            },
        }
    </script>
</head>
<body class="bg-background-light dark:bg-background-dark font-display min-h-screen flex flex-col justify-center items-center py-12 px-4 sm:px-6 lg:px-8 text-slate-900 dark:text-white antialiased transition-colors duration-200">
<!-- Brand Logo / Header (Optional, positioned above card) -->
<div class="sm:mx-auto sm:w-full sm:max-w-md mb-8 flex justify-center">
<div class="flex items-center gap-2">
<div class="w-8 h-8 rounded-lg bg-primary flex items-center justify-center text-white font-bold text-lg shadow-lg shadow-primary/30">
                S
            </div>
<span class="text-xl font-bold tracking-tight text-slate-900 dark:text-white">SaaS Platform</span>
</div>
</div>
<!-- Main Card -->
<div class="w-full max-w-md">
<div class="bg-surface-light dark:bg-surface-dark border border-slate-200 dark:border-slate-800 rounded-xl shadow-sm overflow-hidden">
<div class="p-8 sm:p-10">
<!-- Icon & Headers -->
<div class="text-center mb-8">
<div class="mx-auto w-12 h-12 bg-primary/10 dark:bg-primary/20 rounded-full flex items-center justify-center mb-4">
<span class="material-icons text-primary text-2xl">lock_reset</span>
</div>
<h2 class="text-2xl font-bold tracking-tight text-slate-900 dark:text-white mb-2">
                        Forgot your password?
                    </h2>
<p class="text-sm text-slate-600 dark:text-slate-400">
                        Enter your email address and we'll send you a link to reset your password.
                    </p>
</div>
<!-- Form -->
<form action="#" class="space-y-6" method="POST">
<div>
<label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1.5" for="email">
                            Email address
                        </label>
<div class="relative">
<input autocomplete="email" class="appearance-none block w-full px-4 py-3 border border-slate-300 dark:border-slate-700 rounded-lg placeholder-slate-400 dark:placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent bg-white dark:bg-slate-900/50 text-slate-900 dark:text-white sm:text-sm transition-all shadow-sm" id="email" name="email" placeholder="name@company.com" required="" type="email"/>
<div class="absolute inset-y-0 right-0 flex items-center pr-3 pointer-events-none text-slate-400">
<span class="material-icons text-[20px]">mail_outline</span>
</div>
</div>
</div>
<div>
<button class="group relative w-full flex justify-center py-3 px-4 border border-transparent text-sm font-medium rounded-lg text-white bg-primary hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary shadow-lg shadow-primary/30 transition-all duration-200" type="button">
                            Send Reset Link
                            <span class="absolute right-4 inset-y-0 flex items-center opacity-0 group-hover:opacity-100 transition-opacity duration-200">
<span class="material-icons text-sm">arrow_forward</span>
</span>
</button>
</div>
</form>
<!-- Footer Links -->
<div class="mt-8 pt-6 border-t border-slate-100 dark:border-slate-800 text-center">
<a class="inline-flex items-center text-sm font-medium text-slate-600 hover:text-primary dark:text-slate-400 dark:hover:text-primary transition-colors duration-200 group" href="#">
<span class="material-icons text-sm mr-2 transform group-hover:-translate-x-1 transition-transform duration-200">arrow_back</span>
                        Back to sign in
                    </a>
</div>
</div>
<!-- Bottom decorative bar (optional stripe aesthetic) -->
<div class="h-1.5 w-full bg-gradient-to-r from-primary/80 via-primary to-indigo-400"></div>
</div>
<!-- Help Text -->
<p class="mt-6 text-center text-xs text-slate-500 dark:text-slate-500">
            Protected by reCAPTCHA and subject to the 
            <a class="font-medium hover:text-primary transition-colors" href="#">Privacy Policy</a> 
            and 
            <a class="font-medium hover:text-primary transition-colors" href="#">Terms of Service</a>.
        </p>
</div>
<!-- Background Decoration (Subtle Blobs) -->
<div class="fixed inset-0 -z-10 overflow-hidden pointer-events-none">
<div class="absolute -top-[10%] -left-[5%] w-[40rem] h-[40rem] rounded-full bg-primary/5 dark:bg-primary/10 blur-3xl opacity-60 mix-blend-multiply dark:mix-blend-screen animate-pulse" data-alt="Abstract indigo soft gradient blob"></div>
<div class="absolute top-[20%] -right-[5%] w-[35rem] h-[35rem] rounded-full bg-indigo-300/10 dark:bg-indigo-900/10 blur-3xl opacity-50 mix-blend-multiply dark:mix-blend-screen" data-alt="Abstract soft gradient blob secondary"></div>
</div>
</body></html>
