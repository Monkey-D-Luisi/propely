<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Propely - Sign In</title>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "primary": "#5048e5",
              "background-light": "#f6f6f8",
              "background-dark": "#121121",
            },
            fontFamily: {
              "display": ["Inter", "sans-serif"]
            },
            borderRadius: {"DEFAULT": "0.5rem", "lg": "1rem", "xl": "1.5rem", "full": "9999px"},
          },
        },
      }
    </script>
</head>
<body class="bg-background-light dark:bg-background-dark font-display min-h-screen flex flex-col items-center justify-center relative overflow-hidden text-slate-900 dark:text-slate-100">
<!-- Subtle gradient mesh at the top -->
<div class="absolute top-0 left-0 w-full h-[600px] bg-gradient-to-b from-primary/10 to-transparent pointer-events-none z-0"></div>
<!-- Main Container -->
<div class="relative z-10 w-full max-w-[448px] px-4 sm:px-0 flex flex-col items-center">
<!-- Header -->
<div class="flex flex-col items-center mb-8">
<div class="flex items-center gap-2 mb-3">
<span class="material-symbols-outlined text-primary text-4xl" style="font-variation-settings: 'FILL' 1;">diamond</span>
<h1 class="text-3xl font-bold tracking-tight text-slate-900 dark:text-white">Propely</h1>
</div>
<p class="text-slate-500 dark:text-slate-400 font-medium">Welcome back</p>
</div>
<!-- Login Card -->
<div class="w-full bg-white dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-800 shadow-sm p-8 sm:p-10 flex flex-col gap-6">
<form class="flex flex-col gap-5">
<!-- Email Field -->
<div class="flex flex-col gap-2">
<label class="text-sm font-medium text-slate-700 dark:text-slate-300" for="email">Email address</label>
<input class="w-full rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 px-4 py-3 text-sm text-slate-900 dark:text-slate-100 focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-colors placeholder:text-slate-400" id="email" placeholder="Enter your email" type="email"/>
</div>
<!-- Password Field -->
<div class="flex flex-col gap-2 relative">
<div class="flex items-center justify-between">
<label class="text-sm font-medium text-slate-700 dark:text-slate-300" for="password">Password</label>
<a class="text-sm font-medium text-primary hover:text-primary/80 transition-colors" href="#">Forgot password?</a>
</div>
<input class="w-full rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 px-4 py-3 text-sm text-slate-900 dark:text-slate-100 focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-colors placeholder:text-slate-400" id="password" placeholder="Enter your password" type="password"/>
</div>
<!-- Sign In Button -->
<button class="mt-2 w-full bg-primary hover:bg-primary/90 text-white font-medium text-sm py-3 rounded-lg transition-colors flex justify-center items-center gap-2" type="button">
                    Sign In
                </button>
</form>
<!-- Divider -->
<div class="relative flex items-center py-2">
<div class="flex-grow border-t border-slate-200 dark:border-slate-700"></div>
<span class="flex-shrink-0 mx-4 text-xs font-semibold text-slate-400 dark:text-slate-500 tracking-wider">OR CONTINUE WITH</span>
<div class="flex-grow border-t border-slate-200 dark:border-slate-700"></div>
</div>
<!-- Social Logins -->
<div class="flex gap-4">
<button class="flex-1 flex items-center justify-center gap-2 py-2.5 px-4 border border-slate-300 dark:border-slate-700 rounded-lg hover:bg-slate-50 dark:hover:bg-slate-800 transition-colors text-sm font-medium text-slate-700 dark:text-slate-300" type="button">
<span class="material-symbols-outlined text-xl">language</span>
                    Google
                </button>
<button class="flex-1 flex items-center justify-center gap-2 py-2.5 px-4 border border-slate-300 dark:border-slate-700 rounded-lg hover:bg-slate-50 dark:hover:bg-slate-800 transition-colors text-sm font-medium text-slate-700 dark:text-slate-300" type="button">
<span class="material-symbols-outlined text-xl">code</span>
                    GitHub
                </button>
</div>
</div>
<!-- Footer Links (Create Account) -->
<div class="mt-8 text-center">
<p class="text-sm text-slate-600 dark:text-slate-400">
                Don't have an account? 
                <a class="font-medium text-primary hover:underline" href="#">Create an account</a>
</p>
</div>
<!-- Bottom Links -->
<div class="mt-12 flex items-center justify-center gap-6 text-xs text-slate-500 dark:text-slate-500">
<a class="hover:text-slate-800 dark:hover:text-slate-300 transition-colors" href="#">Privacy Policy</a>
<a class="hover:text-slate-800 dark:hover:text-slate-300 transition-colors" href="#">Terms of Service</a>
<a class="hover:text-slate-800 dark:hover:text-slate-300 transition-colors" href="#">Support</a>
</div>
</div>
</body></html>
