<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Email Verification - Loading State</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#4c44e9",
                        "background-light": "#f6f6f8",
                        "background-dark": "#121121",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: { "DEFAULT": "0.5rem", "lg": "1rem", "xl": "1.5rem", "full": "9999px" },
                    animation: {
                        'spin-slow': 'spin 1.5s linear infinite',
                        'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                    }
                },
            },
        }
    </script>
<style>
        body {
            font-family: 'Inter', sans-serif;
        }
        /* Custom spinner animation curve for a more premium feel */
        @keyframes custom-spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .animate-custom-spin {
            animation: custom-spin 1.2s cubic-bezier(0.55, 0.055, 0.675, 0.19) infinite;
        }
    </style>
</head>
<body class="bg-background-light dark:bg-background-dark font-display antialiased min-h-screen flex flex-col transition-colors duration-200">
<!-- Navbar Placeholder for Context -->
<header class="w-full border-b border-gray-200 dark:border-gray-800 bg-white dark:bg-[#1a192e]">
<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
<div class="flex items-center gap-2">
<div class="h-8 w-8 bg-primary rounded-lg flex items-center justify-center text-white font-bold text-lg shadow-lg shadow-primary/30">
                    V
                </div>
<span class="text-gray-900 dark:text-white font-semibold text-lg tracking-tight">Veriflow</span>
</div>
<div class="hidden md:flex items-center gap-6 text-sm text-gray-500 dark:text-gray-400">
<span class="cursor-pointer hover:text-gray-900 dark:hover:text-white transition-colors">Help</span>
<span class="cursor-pointer hover:text-gray-900 dark:hover:text-white transition-colors">Privacy</span>
</div>
</div>
</header>
<!-- Main Content Area -->
<main class="flex-grow flex items-center justify-center p-4">
<!-- Loading Card -->
<div class="w-full max-w-md bg-white dark:bg-[#1a192e] rounded-xl shadow-lg border border-gray-100 dark:border-gray-800 p-8 md:p-12 text-center relative overflow-hidden group">
<!-- Decorative Top Gradient Line -->
<div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-transparent via-primary to-transparent opacity-80"></div>
<!-- Loading Spinner Container -->
<div class="relative flex justify-center items-center mb-8">
<!-- Outer Pulse Effect -->
<div class="absolute w-24 h-24 bg-primary/10 rounded-full animate-pulse-slow"></div>
<!-- Spinner SVG -->
<svg class="w-16 h-16 text-primary animate-custom-spin" fill="none" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="3"></circle>
<path class="opacity-100" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z" fill="currentColor"></path>
</svg>
</div>
<!-- Text Content -->
<h1 class="text-2xl font-semibold text-gray-900 dark:text-white mb-3 tracking-tight">
                Verifying your email...
            </h1>
<p class="text-gray-500 dark:text-gray-400 text-sm leading-relaxed mb-8">
                We're securely checking your credentials. <br/>This will just take a moment.
            </p>
<!-- Indeterminate Progress Bar -->
<div class="w-full bg-gray-100 dark:bg-gray-800 rounded-full h-1.5 mb-6 overflow-hidden">
<div class="bg-primary h-1.5 rounded-full w-1/3 animate-[translateX_1.5s_ease-in-out_infinite] transform origin-left" style="animation-name: slide-indeterminate; animation-duration: 2s; animation-iteration-count: infinite;"></div>
</div>
<style>
                @keyframes slide-indeterminate {
                    0% { margin-left: -50%; width: 50%; }
                    50% { margin-left: 25%; width: 50%; }
                    100% { margin-left: 100%; width: 50%; }
                }
            </style>
<!-- Footer Help Link -->
<div class="mt-4 pt-6 border-t border-gray-100 dark:border-gray-800">
<p class="text-xs text-gray-400 dark:text-gray-500">
                    Taking too long? 
                    <a class="text-primary hover:text-indigo-500 font-medium transition-colors ml-1 inline-flex items-center" href="#">
                        Contact Support 
                        <span class="material-icons text-[14px] ml-0.5">arrow_forward</span>
</a>
</p>
</div>
<!-- Accessibility Announcer -->
<div aria-live="polite" class="sr-only" role="status">
                Verifying email address, please wait.
            </div>
</div>
</main>
<!-- Simple Footer -->
<footer class="py-6 text-center">
<p class="text-xs text-gray-400 dark:text-gray-600">
            © 2023 Veriflow Inc. Secure Verification System.
        </p>
</footer>
</body></html>
