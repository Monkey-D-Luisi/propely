<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Propely Email Verification Loading Screen</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#5048e5",
                        "background-light": "#f6f6f8",
                        "background-dark": "#121121",
                    },
                    fontFamily: {
                        "display": ["Inter"]
                    },
                    borderRadius: {"DEFAULT": "0.5rem", "lg": "1rem", "xl": "1.5rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
        .loader {
            border: 4px solid rgba(80, 72, 229, 0.2);
            border-top: 4px solid #5048e5;
            border-radius: 50%;
            width: 48px;
            height: 48px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .skeleton-pulse {
            animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: .5; }
        }
    </style>
</head>
<body class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-slate-100 min-h-screen flex flex-col relative overflow-hidden">
<div class="absolute top-0 left-0 w-full h-96 bg-gradient-to-b from-primary/10 to-transparent -z-10"></div>
<div class="absolute top-0 left-1/4 w-1/2 h-64 bg-primary/10 blur-[100px] rounded-full -z-10 mix-blend-multiply dark:mix-blend-screen"></div>
<header class="w-full flex justify-center py-8">
<div class="flex items-center gap-3">
<div class="text-primary size-8">
<svg fill="none" viewbox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
<g clip-path="url(#clip0_6_535)">
<path clip-rule="evenodd" d="M47.2426 24L24 47.2426L0.757355 24L24 0.757355L47.2426 24ZM12.2426 21H35.7574L24 9.24264L12.2426 21Z" fill="currentColor" fill-rule="evenodd"></path>
</g>
<defs>
<clippath id="clip0_6_535"><rect fill="white" height="48" width="48"></rect></clippath>
</defs>
</svg>
</div>
<h1 class="text-2xl font-bold tracking-tight text-slate-900 dark:text-slate-100">Propely</h1>
</div>
</header>
<main class="flex-grow flex items-center justify-center p-4">
<div class="w-full max-w-[448px] bg-white dark:bg-slate-800 rounded-xl border border-slate-200 dark:border-slate-700 shadow-sm p-8 flex flex-col items-center">
<div class="mb-6">
<div class="loader"></div>
</div>
<h2 class="text-xl font-bold text-slate-900 dark:text-white mb-2 text-center">Verifying your email...</h2>
<p class="text-slate-500 dark:text-slate-400 text-center text-sm leading-relaxed mb-8 max-w-[320px]">
                Please wait while we confirm your email address and prepare your Propely dashboard.
            </p>
<div class="w-full border border-slate-100 dark:border-slate-700/50 rounded-lg p-5 bg-slate-50/50 dark:bg-slate-800/50">
<div class="flex items-center gap-4 mb-5">
<div class="w-12 h-12 rounded-full bg-slate-200 dark:bg-slate-700 skeleton-pulse"></div>
<div class="flex-1 space-y-2">
<div class="h-3 w-1/2 bg-slate-200 dark:bg-slate-700 rounded skeleton-pulse"></div>
<div class="h-2 w-1/3 bg-slate-200 dark:bg-slate-700 rounded skeleton-pulse"></div>
</div>
</div>
<div class="space-y-3">
<div class="h-2 w-full bg-slate-200 dark:bg-slate-700 rounded skeleton-pulse"></div>
<div class="h-2 w-5/6 bg-slate-200 dark:bg-slate-700 rounded skeleton-pulse"></div>
<div class="h-2 w-4/6 bg-slate-200 dark:bg-slate-700 rounded skeleton-pulse"></div>
</div>
</div>
</div>
</main>
</body></html>
